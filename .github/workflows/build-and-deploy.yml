name: build-and-deploy

on:
  workflow_call:
    inputs:
      image:
        description: "Full image reference to build and push, e.g. ghcr.io/eayanwale/my-app"
        required: true
        type: string
      instance_id:
        description: "The homelab-broker instance id to deploy to (shown on the instance's detail page)"
        required: true
        type: string
      dockerfile:
        description: "Path to the Dockerfile to build"
        required: false
        type: string
        default: Dockerfile
      context:
        description: "Build context"
        required: false
        type: string
        default: .
      platforms:
        description: "Comma-separated platforms to build for"
        required: false
        type: string
        default: linux/amd64,linux/arm64
      broker_url:
        description: "Base URL of the homelab-broker instance to deploy to"
        required: false
        type: string
        default: https://lab.knoch.dev
      broker_tailscale_url:
        description: >
          If set (together with the TS_OAUTH_* secrets), reach the
          broker directly over Tailscale at this URL instead of
          broker_url -- works around a confirmed-live issue where some
          CI runners' requests get corrupted somewhere inside the
          Cloudflare Tunnel path specifically (not a bug in this
          workflow or in the broker itself -- a clean request was
          independently verified on both ends via a byte-level trace).
          e.g. http://100.119.250.100:8000
        required: false
        type: string
        default: ""
    secrets:
      BROKER_DEPLOY_TOKEN:
        description: "A deploy token scoped to this one instance (create one on the instance's Deploy tab)"
        required: true
      TS_OAUTH_CLIENT_ID:
        description: "Tailscale OAuth client id, tagged to reach the broker's tailnet address -- only needed with broker_tailscale_url set"
        required: false
      TS_OAUTH_SECRET:
        description: "Tailscale OAuth client secret -- only needed with broker_tailscale_url set"
        required: false

# Deliberately no top-level `permissions:` block here -- confirmed
# live that GitHub rejects a cross-repository workflow_call with
# startup_failure when the REUSABLE workflow declares one, even though
# the same values on the CALLER work fine and flow down correctly.
# Callers need `permissions: contents: read, packages: write` in
# their own caller workflow (see README.md's example) for the GHCR
# push to work.

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: ${{ inputs.platforms }}
          push: true
          tags: |
            ${{ inputs.image }}:${{ github.sha }}
            ${{ inputs.image }}:main
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Connect to Tailscale
        if: ${{ inputs.broker_tailscale_url != '' }}
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:app-deploy

      - name: Deploy through homelab-broker
        env:
          BROKER_DEPLOY_TOKEN: ${{ secrets.BROKER_DEPLOY_TOKEN }}
          BROKER_URL: ${{ inputs.broker_tailscale_url != '' && inputs.broker_tailscale_url || inputs.broker_url }}
          INSTANCE_ID: ${{ inputs.instance_id }}
          IMAGE: ${{ inputs.image }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          # Confirmed live: some CI runners' requests over the public
          # Cloudflare-tunneled URL get corrupted somewhere inside the
          # tunnel path itself (a byte-level trace showed curl sending
          # a clean request and the broker receiving a mangled one,
          # inconsistently across otherwise-identical attempts) --
          # broker_tailscale_url (above) sidesteps that path entirely
          # for callers that configure it. "Connection: close" plus a
          # few retries is kept here regardless as a cheap defensive
          # measure for callers still on the public URL path.
          # TEMP diagnostic: byte-level trace of one request over the
          # Tailscale path, to see exactly what this runner sends/receives
          # (removed once the investigation is done).
          curl -sS --trace-ascii /tmp/ts-trace.txt -X POST \
            -H "Connection: close" \
            "$BROKER_URL/api/instances/$INSTANCE_ID/deploy" \
            -H "Authorization: Bearer $BROKER_DEPLOY_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"image\": \"$IMAGE\", \"tag\": \"$SHA\"}" || true
          echo "::group::Tailscale path byte trace"
          cat /tmp/ts-trace.txt || true
          echo "::endgroup::"

          response=""
          http_code=""
          for attempt in 1 2 3; do
            response=$(curl -sS -w '\n%{http_code}' -X POST \
              -H "Connection: close" \
              "$BROKER_URL/api/instances/$INSTANCE_ID/deploy" \
              -H "Authorization: Bearer $BROKER_DEPLOY_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"image\": \"$IMAGE\", \"tag\": \"$SHA\"}")
            http_code=$(echo "$response" | tail -n1)
            if [ "$http_code" = "202" ]; then
              break
            fi
            echo "deploy request attempt $attempt: HTTP $http_code -- retrying"
            sleep 3
          done

          body=$(echo "$response" | sed '$d')
          echo "deploy request: HTTP $http_code"
          echo "$body"

          if [ "$http_code" != "202" ]; then
            echo "::error::deploy request failed after 3 attempts"
            exit 1
          fi

          operation_id=$(echo "$body" | grep -o '"id":[0-9]*' | head -1 | grep -o '[0-9]*')
          echo "polling operation $operation_id..."

          for _ in $(seq 1 60); do
            op=$(curl -sS -H "Connection: close" "$BROKER_URL/api/operations/$operation_id" \
              -H "Authorization: Bearer $BROKER_DEPLOY_TOKEN")
            status=$(echo "$op" | grep -o '"status":"[a-z]*"' | head -1 | cut -d'"' -f4)
            if [ "$status" = "succeeded" ]; then
              echo "deploy succeeded"
              exit 0
            fi
            if [ "$status" = "failed" ]; then
              echo "::error::deploy failed"
              echo "$op"
              exit 1
            fi
            sleep 5
          done

          echo "::error::timed out waiting for the deploy to finish"
          exit 1
